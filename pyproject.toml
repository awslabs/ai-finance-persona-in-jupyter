[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "jupyter_ai_fintyche"
version = "0.1.0"
description = "FinTyche: a quantitative finance persona for Jupyter AI, with QuantLib and PyPortfolioOpt function discovery and execution"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jupyter_ai_persona_manager==0.4.0",
    "jupyterlab-chat==0.26.0",
    "litellm==1.109.1",
    "QuantLib==1.44",
    "PyPortfolioOpt==1.6.0",
    "nbformat==5.11.1",
    "pandas==3.1.1",
    "numpy==2.2.6",
    "yfinance==1.8.0",
]

[project.scripts]
fintyche = "jupyter_ai_fintyche.cli:main"

[project.optional-dependencies]
jupyternaut = [
    "jupyter_ai_jupyternaut==0.1.0",
]
# Kept so existing `pip install ".[market-data]"` commands still work;
# yfinance is now a core dependency.
market-data = [
    "yfinance==1.8.0",
]
test = [
    "coverage==7.17.3",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["jupyter_ai_fintyche"]

###############################################################################
# Provide FinTyche on the personas entry point to `jupyter_ai_persona_manager`.
# See: https://packaging.python.org/en/latest/specifications/entry-points/

[project.entry-points."jupyter_ai.personas"]
fintyche = "jupyter_ai_fintyche.persona:FinTychePersona"
###############################################################################
