<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" />
  <!-- Rising price/candlestick chart -->
  <line x1="15" y1="70" x2="85" y2="70" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <rect x="22" y="58" width="6" height="12" fill="white" opacity="0.85"/>
  <line x1="25" y1="52" x2="25" y2="72" stroke="white" stroke-width="1.5" opacity="0.85"/>
  <rect x="37" y="48" width="6" height="16" fill="white" opacity="0.85"/>
  <line x1="40" y1="42" x2="40" y2="66" stroke="white" stroke-width="1.5" opacity="0.85"/>
  <rect x="52" y="38" width="6" height="14" fill="white" opacity="0.9"/>
  <line x1="55" y1="32" x2="55" y2="54" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <rect x="67" y="26" width="6" height="18" fill="white" opacity="0.95"/>
  <line x1="70" y1="20" x2="70" y2="46" stroke="white" stroke-width="1.5" opacity="0.95"/>
  <!-- Trend line -->
  <polyline points="20,68 35,50 50,44 65,28 80,20" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Label -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.95">Q</text>
</svg>
